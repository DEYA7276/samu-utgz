services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: samu
      POSTGRES_USER: samu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samu -d samu"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [backend]
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      APP_ENV: production
      COOKIE_SECURE: '1'
      DATABASE_URL: postgresql+psycopg://samu:${POSTGRES_PASSWORD}@database:5432/samu
      SAMU_PRIVATE_DIR: /code/private
    volumes:
      - samu_private:/code/private
    depends_on:
      database: {condition: service_healthy}
    networks: [backend]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SAMU_DOMAIN: ${SAMU_DOMAIN:?Definir SAMU_DOMAIN en .env}
    ports: ['80:80','443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [backend]
networks:
  backend:
volumes:
  postgres_data:
  samu_private:
  caddy_data:
  caddy_config:
