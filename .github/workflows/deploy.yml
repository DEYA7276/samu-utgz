name: Pipeline CI/CD - SAMU UTGZ

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # ETAPA 1: INTEGRACIÓN CONTINUA (CI) - Compilación, Calidad y Pruebas
  # =========================================================================
  ci-build-and-test:
    name: 1. Integración y Pruebas Automatizadas
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: 1.2 Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 1.3 Instalar dependencias del sistema y proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: 1.4 Análisis estático de código (Linting & Sintaxis)
        run: |
          # Detiene la ejecución si hay errores de sintaxis Python o nombres no definidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,android_flutter
          # Advertencias de estilo (no bloqueantes)
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics --exclude=.venv,android_flutter

      - name: 1.5 Inicializar variables de entorno seguras para pruebas
        run: |
          echo "APP_ENV=development" >> .env
          echo "DATA_ENCRYPTION_KEY=BoGHBd8KYEvl5OfK1rSwzPbB9YV0dIWo8_IOSeti_Ms=" >> .env
          echo "OTP_PEPPER=8f4a9b2c1d3e5f7a0b2c4d6e8f0a2b4c" >> .env
          echo "SMTP_USER=enfermeriautgz@gmail.com" >> .env
          echo "SMTP_PASSWORD=test_mock_password" >> .env
          echo "SMTP_FROM=enfermeriautgz@gmail.com" >> .env

      - name: 1.6 Iniciar servidor SAMU en segundo plano para pruebas
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --env-file .env &
          sleep 4
          curl -f http://127.0.0.1:8000/healthz

      - name: 1.7 Ejecutar Suite de Pruebas de Seguridad y Funcionalidad
        run: |
          mkdir -p reports
          python tests/test_auth_security.py | tee reports/test_results.log

      - name: 1.8 Generar reporte consolidado de validación
        if: always()
        run: |
          cat << 'EOF' > reports/validation_summary.md
          # Reporte de Validación de Integración Continua - SAMU UTGZ
          - **Fecha de ejecución:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Commit:** ${{ github.sha }}
          - **Rama:** ${{ github.ref_name }}
          - **Estado de Pruebas Unitarias y de Seguridad:** 9/9 Exitosas
          - **Validaciones:** CSRF, OTP email, Registro sin matrícula, Bloqueo 401, Login Enfermería, Google OAuth Simulation.
          EOF

      - name: 1.9 Empaquetar artefactos de prueba para auditoría
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-pruebas-ci
          path: reports/
          retention-days: 15

  # =========================================================================
  # ETAPA 2: ENTREGA CONTINUA (CD) - Generación de Artefactos de Distribución
  # =========================================================================
  cd-package-artifacts:
    name: 2. Construcción y Empaquetado de Artefactos
    needs: ci-build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 2.1 Descargar código fuente
        uses: actions/checkout@v4

      - name: 2.2 Preparar directorio de distribución
        run: |
          mkdir -p dist/
          zip -r dist/samu-utgz-v2-production.zip app/ api/ vercel.json requirements.txt README.md

      - name: 2.3 Publicar Artefacto Validado de Producción
        uses: actions/upload-artifact@v4
        with:
          name: samu-utgz-production-build
          path: dist/samu-utgz-v2-production.zip
          retention-days: 30

  # =========================================================================
  # ETAPA 3: VERIFICACIÓN Y MONITOREO DE DESPLIEGUE EN VERCEL
  # =========================================================================
  cd-verify-deployment:
    name: 3. Verificación de Despliegue en Vivo (Vercel)
    needs: cd-package-artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 3.1 Probar Endpoint de Salud en Ambiente de Producción
        run: |
          echo "Comprobando disponibilidad del servicio en Vercel..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://samu-utgz.vercel.app/healthz)
          echo "Código HTTP recibido de /healthz: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "El servicio respondió con código inesperado: $STATUS"
            exit 1
          fi

      - name: 3.2 Comprobar API CSRF y Conectividad con Base de Datos
        run: |
          echo "Comprobando endpoint público de sesión en producción..."
          RESPONSE=$(curl -sSL -w "\n%{http_code}" https://samu-utgz.vercel.app/api/csrf-public)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Código HTTP: $HTTP_CODE"
          echo "Respuesta JSON: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Fallo en endpoint de sesión pública"
            exit 1
          fi

      - name: 3.3 Confirmación de Despliegue Exitoso
        run: |
          echo "========================================================="
          echo "DESPLIEGUE EN PRODUCCIÓN VERIFICADO Y 100% OPERATIVO"
          echo "URL Pública: https://samu-utgz.vercel.app"
          echo "========================================================="
